<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matra Clinical — Doctor Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E5F0FC;--cb:#CFDDED;--p:#0755AD;--pd:#054487;--s:#087FC4;--lb:#DCEBFA;--g:#20C997;--t1:#1B2D45;--t2:#34495F;--t3:#5B6E86;--bd:#D8E4F0;--sh:0 1px 2px rgba(7,85,173,.06),0 8px 22px rgba(27,45,69,.07)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--t2);background:var(--bg);font-variant-numeric:tabular-nums}
h1,h2,h3,.hf{font-family:Manrope,Inter,sans-serif;color:var(--t1)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--s);outline-offset:2px}
header{height:64px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font:800 17px Manrope,sans-serif;color:var(--p)}.logo b{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;display:grid;place-items:center}
.logo small{font:500 12px Inter;color:var(--t3)}
.sr{display:flex;align-items:center;gap:8px;flex:1;max-width:440px;background:var(--bg);border:1px solid var(--cb);border-radius:10px;padding:0 12px;height:40px;color:var(--t3)}.sr input{border:0;background:none;flex:1;min-width:0;outline:0;color:var(--t1);height:38px}
.ib{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--cb);background:#fff;color:var(--p);display:grid;place-items:center;position:relative}
.dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:#D92D20;border:2px solid #fff}
.usr{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--bd)}.usr .av{background:var(--p);color:#fff}
.wrap{display:flex;max-width:1680px;margin:0 auto}
aside{width:248px;flex:none;background:linear-gradient(180deg,#0755AD,#06458F);padding:14px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;display:flex;flex-direction:column;z-index:25}
.gl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9CC3EE;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:#E5F0FC;padding:7px 8px;border-radius:10px;font-weight:500;margin-bottom:2px;min-height:44px}
.nav .t{width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}
.nav:hover{background:rgba(255,255,255,.1)}.nav.on{background:rgba(255,255,255,.2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--g)}
.nav em{margin-left:auto;font-style:normal;background:#D92D20;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.ucard{margin-top:auto;background:rgba(255,255,255,.12);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;color:#fff}.ucard .av{background:#fff;color:var(--p)}
.close,.burger,.ov{display:none}
main{flex:1;min-width:0;padding:24px;max-width:1440px}
h1{margin:0;font-size:30px;font-weight:800}h2{margin:0;font-size:15.5px;font-weight:700}
.card{background:#fff;border:1px solid var(--cb);border-radius:16px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.ch small{display:block;font-weight:400;font-size:12.5px;color:var(--t3)}
.hero{background:linear-gradient(120deg,#0755AD,#087FC4);border-radius:20px;color:#fff;padding:24px;margin-bottom:20px;box-shadow:var(--sh)}
.hero h1{color:#fff;font-size:32px}.hero p{margin:4px 0 16px;color:#DCEBFA}
.hc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hc button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;color:#fff;text-align:left;padding:14px;min-height:44px}.hc button:hover{background:rgba(255,255,255,.26)}
.hc b{display:block;font:800 34px Manrope,sans-serif}.hc span{font-size:13px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:#0B8F63;background:#E3F7EF;padding:5px 12px;border-radius:99px;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.k{background:#fff;border:1px solid var(--cb);border-radius:16px;box-shadow:var(--sh);padding:14px;text-align:left;min-height:44px}.k:hover{border-color:var(--s)}
.k .t{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}.k b{display:block;font:800 34px/1 Manrope,sans-serif;color:var(--t1)}.k span{font-size:13px;color:var(--t3);font-weight:500}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:99px;white-space:nowrap}
.normal{color:#0B8F63;background:#E3F7EF}.moderate{color:#B06C00;background:#FFF3D6}.severe{color:#D9480F;background:#FFE8DC}.danger{color:#9B1C1C;background:#FDE2E2}.insuff{color:#475569;background:#E8EDF3}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:10px;min-height:44px}.row:hover{background:var(--lb)}.row:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--lb);color:var(--p);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--p);background:#fff;color:var(--p);font-weight:600;font-size:13px}.btn:hover{background:var(--lb)}
.btn.p{background:var(--p);color:#fff}.btn.p:hover{background:var(--pd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--p);font-weight:600;min-height:44px;padding:0 6px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.st div{background:var(--bg);border-radius:12px;padding:10px 12px}.st b{display:block;font-weight:700;color:var(--t1);margin-top:3px}.st .chip{margin-top:5px;font-size:11px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t3)}
.ban{border-top:5px solid}.ban.high{border-color:#D9480F}.ban.medium{border-color:#B06C00}.ban.low{border-color:#0B8F63}
table{width:100%;border-collapse:collapse;font-size:14.5px}th{position:sticky;top:0;background:var(--lb);color:var(--p);text-align:left;font-weight:700;padding:11px 10px;font-size:13px}td{padding:12px 10px;border-bottom:1px solid var(--bd)}tbody tr:nth-child(even){background:#F4F8FD}tr.cl{cursor:pointer}tr.cl:hover{background:var(--lb)}
.ov2{overflow-x:auto}
.tl{display:flex;justify-content:space-between}.tl button{flex:1;border:0;background:none;text-align:center;min-height:56px}.tl i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 5px;background:#fff;box-shadow:0 0 0 2px #0B8F63}
.tl .cur i{background:var(--p);box-shadow:0 0 0 5px var(--lb)}.tl .am i{box-shadow:0 0 0 2px #B06C00}.tl .rd i{box-shadow:0 0 0 2px #D92D20}.tl small{display:block;color:var(--t3);font-weight:700;font-size:12px}
.al{display:flex;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer;align-items:flex-start}.al.r{background:#FDE2E2}.al.a{background:#FFF3D6}
.ai{background:linear-gradient(180deg,#F2F0FF,#fff);border-color:#D9CCFA}.bub{padding:9px 12px;border-radius:14px;margin-bottom:6px;max-width:92%;line-height:1.5;font-size:13.5px}.bub.a{background:var(--lb);color:var(--t1)}.bub.d{background:var(--p);color:#fff;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{border:1px solid var(--cb);background:#fff;border-radius:99px;padding:8px 12px;font-size:12px;min-height:36px;color:var(--p)}
.f{width:100%;border:1px solid var(--cb);border-radius:10px;padding:10px 12px;background:var(--bg);min-height:44px;color:var(--t1)}.f:focus{background:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--cb);margin-bottom:16px;overflow-x:auto}.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--t3);border-bottom:3px solid transparent;text-transform:capitalize;white-space:nowrap;min-height:44px}.tabs .on{color:var(--p);border-color:var(--p)}
.flag{background:#FFF3D6}.note{border-left:3px solid var(--s);padding:2px 12px;margin-bottom:12px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tg>div{border:1px solid var(--bd);border-radius:14px;padding:12px}
.seg{display:inline-flex;background:var(--lb);border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--t3);min-height:36px;text-transform:capitalize}.seg .on{background:#fff;color:var(--p);box-shadow:var(--sh)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;display:none;max-width:90vw}
#np{position:absolute;right:70px;top:60px;width:340px;max-width:92vw;background:#fff;border:1px solid var(--cb);border-radius:14px;box-shadow:0 12px 34px #1B2D4540;overflow:hidden}
#np button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:#fff;padding:12px 16px;min-height:44px}#np .u{background:var(--lb)}
.hl{background:#FEF3C7!important;box-shadow:inset 0 0 0 2px #F59E0B;font-weight:700;color:var(--t1)}.hlb{background:#FFF8E1;border-color:#F59E0B}.ban.none{border-color:#475569}.mt td,.mt th{white-space:nowrap}.mt th{font-size:12px}.mt small{display:block;font-weight:500;color:var(--t3)}.ok{color:#0B8F63;font-weight:700}.no{color:#D92D20;font-weight:700}.un{color:#475569;font-weight:700}
@media(max-width:1100px){.kp{grid-template-columns:repeat(3,1fr)}.dg{grid-template-columns:1fr}}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
@media(max-width:768px){
 .burger,.close{display:grid;place-items:center}.logo small,#date,.usr div{display:none}.usr{padding:0;border:0}
 aside{position:fixed;left:0;top:64px;transform:translateX(-100%);transition:transform .2s;box-shadow:6px 0 24px #0006;width:272px;max-width:86vw}aside.open{transform:none}
 .ov.open{display:block;position:fixed;inset:64px 0 0;background:#1B2D4580;z-index:20}
 .close{width:100%;height:44px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-weight:600;grid-auto-flow:column;gap:8px;margin-bottom:6px}
 .kp{grid-template-columns:repeat(2,1fr)}.st,.hc{grid-template-columns:repeat(2,1fr)}.tg{grid-template-columns:1fr}main{padding:14px}h1{font-size:24px}.hero h1{font-size:26px}.mg{grid-template-columns:1fr!important;height:auto!important}}

/* ===== Gradient polish (same palette: #0755AD / #087FC4 / #DCEBFA / #20C997) ===== */
body{background:linear-gradient(180deg,#DCEBFA 0,#E5F0FC 260px,#F2F8FE 100%) fixed}
header{background:linear-gradient(90deg,#fff 0,#F1F7FE 55%,#DCEBFA 100%);box-shadow:0 2px 14px rgba(7,85,173,.08)}
aside{background:linear-gradient(170deg,#087FC4 0,#0755AD 38%,#054487 100%)}
.nav.on{background:linear-gradient(90deg,rgba(255,255,255,.30),rgba(255,255,255,.08));box-shadow:inset 3px 0 0 var(--g)}
.nav:hover{background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}
.ucard{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2)}
.card{background:linear-gradient(180deg,#fff 0,#F5F9FF 100%)}
.card.ai{background:linear-gradient(160deg,#F2F0FF 0,#fff 70%)}
.hero{background:radial-gradient(circle at 92% 8%,rgba(32,201,151,.35),transparent 38%),linear-gradient(120deg,#054487 0,#0755AD 45%,#087FC4 100%)}
.hc button{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08))}
.hc button:hover{background:linear-gradient(135deg,rgba(255,255,255,.38),rgba(255,255,255,.14))}
.k{background:linear-gradient(160deg,#fff 0,#EEF5FD 100%)}.k:hover{background:linear-gradient(160deg,#fff 0,#DCEBFA 100%);transform:translateY(-2px);transition:transform .15s}
.k .t{background-image:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.btn{background:linear-gradient(180deg,#fff 0,#E8F1FC 100%)}.btn:hover{background:linear-gradient(180deg,#F4F9FF 0,#DCEBFA 100%)}
.btn.p{background:linear-gradient(135deg,#0755AD 0,#087FC4 100%);border-color:#0755AD;box-shadow:0 4px 12px rgba(7,85,173,.28)}
.btn.p:hover{background:linear-gradient(135deg,#054487 0,#0755AD 100%)}
.ib{background:linear-gradient(180deg,#fff,#E8F1FC)}
th{background:linear-gradient(180deg,#E8F1FC 0,#CFE2F7 100%)}
tbody tr:nth-child(even){background:linear-gradient(90deg,#F4F8FD,#EDF4FC)}
tr.cl:hover,.row:hover{background:linear-gradient(90deg,#DCEBFA,#EEF5FD)}
.av{background:linear-gradient(135deg,#DCEBFA,#B9D6F4)}
.st div,.cell{background:linear-gradient(160deg,#F2F7FD,#E3EEFA)}
.tabs .on{background:linear-gradient(180deg,transparent,rgba(7,85,173,.1))}
.seg{background:linear-gradient(180deg,#DCEBFA,#CFE2F7)}.seg .on{background:linear-gradient(180deg,#fff,#EEF5FD)}
.chips button{background:linear-gradient(180deg,#fff,#EAF2FC)}
.bub.a{background:linear-gradient(135deg,#DCEBFA,#CFE2F7)}.bub.d{background:linear-gradient(135deg,#0755AD,#087FC4)}
.normal{background:linear-gradient(135deg,#E3F7EF,#C9F0E0)}.moderate{background:linear-gradient(135deg,#FFF3D6,#FFE7B0)}.severe{background:linear-gradient(135deg,#FFE8DC,#FFD2BC)}.danger{background:linear-gradient(135deg,#FDE2E2,#FBC7C7)}.insuff{background:linear-gradient(135deg,#E8EDF3,#D8E0EA)}
.al.r{background:linear-gradient(90deg,#FDE2E2,#FFF1F1)}.al.a{background:linear-gradient(90deg,#FFF3D6,#FFFAEB)}
.flag{background:linear-gradient(90deg,#FFF3D6,#FFFAEB)}
.live{background:linear-gradient(135deg,#E3F7EF,#C9F0E0)}
#toast{background:linear-gradient(135deg,#1B2D45,#054487)}
.ban{border-top-width:5px;box-shadow:var(--sh),0 -3px 14px -6px currentColor}
.hlb{background:linear-gradient(90deg,#FFF3D0,#FFF9E6)}
.note{background:linear-gradient(90deg,#EAF3FD,transparent)}

/* ===== Phone / tablet: sidebar is a slide-in drawer that never blocks the page ===== */
aside{height:calc(100vh - 64px);height:calc(100dvh - 64px)}
body.lock{overflow:hidden}
@media(max-width:900px){
 .burger,.close{display:grid;place-items:center}.logo small,#date{display:none}
 aside{position:fixed;left:0;top:64px;width:272px;max-width:86vw;z-index:40;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:28px;box-shadow:none;visibility:hidden}
 aside.open{transform:none;visibility:visible;box-shadow:8px 0 28px rgba(5,68,135,.45)}
 .ov{display:none}.ov.open{display:block;position:fixed;inset:64px 0 0;background:rgba(27,45,69,.5);z-index:35}
 .close{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.4);border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));color:#fff;font-weight:600;grid-auto-flow:column;gap:8px;margin-bottom:6px;flex:none}
 .wrap{display:block}main{padding:14px}
}
</style></head><body>
<header>
 <button class="ib burger" data-a="menu" aria-label="Open menu"></button>
 <div class="logo"><b>M</b><span>Matra Clinical <small>Rajpura District Hospital</small></span></div>
 <label class="sr" id="srb"></label>
 <span id="date" class="hf" style="margin-left:auto;font-size:13px;color:var(--t3);font-weight:600">Tue, 14 Jul 2026</span>
 <button class="ib" id="bell" data-a="notif" aria-label="Notifications"></button>
 <button class="ib" data-a="t" data-i="Dark theme isn't enabled in this demo." aria-label="Toggle theme" id="moon"></button>
 <div class="usr"><div class="av">SK</div><div style="line-height:1.25"><b style="color:var(--t1)">Dr. Sunita Kapoor</b><div style="font-size:12px;color:var(--t3)">OB-GYN · Ward 3</div></div></div>
 <div id="np" hidden></div>
</header>
<div class="wrap"><aside id="side"></aside><div class="ov" id="ov" data-a="menu"></div><main id="main"></main></div>

function refs(){const L={pending:["Pending","moderate"],acc:["In your queue","normal"],sch:["Scheduled","normal"]},src=["ANM P. Verma","ASHA M. Bai","ANM K. Rao","ASHA R. Devi","ANM P. Verma"];return`<h1 style="margin-bottom:16px">High-risk referrals</h1><div class="card">${S.ref.map((r,k)=>{const p=pt(r.id),l=L[r.st];return`<div style="padding:14px 0;border-bottom:1px solid var(--bd)"><div style="display:flex;gap:12px;align-items:center">${av(p.name)}<div><b style="color:var(--t1)">${p.name}</b> ${stc(RS[p.risk])}<div style="font-size:12.5px;color:var(--t3)">W${p.week} · ${p.v} · via ${src[k]}</div></div><span class="chip ${l[1]}" style="margin-left:auto">${l[0]}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-a="open" data-i="${p.id}">Review Case</button><button class="btn p" ${r.st!="pending"?"disabled":""} data-a="acc" data-i="${p.id}">Accept Referral</button><button class="btn" ${r.info?"disabled":""} data-a="info" data-i="${p.id}">${r.info?"Info requested ✓":"Request More Information"}</button><button class="btn" data-a="sc" data-i="${p.id}">Schedule Appointment</button></div>${r.sc?`<div style="display:flex;gap:8px;margin-top:10px;background:var(--bg);padding:10px;border-radius:12px"><input class="f" id="tm${p.id}" aria-label="Appointment time" placeholder="Time, e.g. 15:30" style="max-width:200px"><button class="btn p" data-a="cf" data-i="${p.id}">Confirm</button></div>`:""}</div>`}).join("")}</div>`}
function appts(){return`<h1 style="margin-bottom:16px">Today's appointments</h1><div class="card">${AP.map(a=>`<div class="row" data-a="open" data-i="${a[1]}"><b class="m" style="width:56px;color:var(--t3)">${a[0]}</b>${av(pt(a[1]).name)}<div><b style="color:var(--t1)">${pt(a[1]).name}</b><div style="font-size:12.5px;color:var(--t3)">${a[2]}</div></div><span style="margin-left:auto;color:var(--t3);display:flex;gap:4px;align-items:center">${ic("pin","#5B6E86",14)}${a[3]}</span></div>`).join("")}</div>`}

function tlV(){const p=pt(S.sel);return`<div class="ch" style="flex-wrap:wrap"><h1>Pregnancy timeline</h1><select class="f" style="max-width:260px" data-a="selp" aria-label="Choose patient">${P.map(x=>`<option value="${x.id}" ${x.id==p.id?"selected":""}>${x.name} — W${x.week}</option>`).join("")}</select></div><div class="card"><div class="ch"><h2>${p.name}<small>Week ${p.week} of 40 · EDD ${p.edd}</small></h2></div>${tline(p)}</div>`}
function anaV(){const f=S.f,R=AN.filter(r=>(f.vil=="All"||r[0]==f.vil)&&(f.anm=="All"||r[1]==f.anm)&&(f.mon=="All"||r[2]==f.mon)),sel=(k,l,o)=>`<div><div class="lbl" style="margin-bottom:4px">${l}</div><select class="f" data-a="flt" data-k="${k}">${o.map(v=>`<option ${v==f[k]?"selected":""}>${v}</option>`).join("")}</select></div>`;
 const mx=100,bw=Math.max(40,Math.min(70,520/Math.max(R.length,1)/3));
 return`<div class="ch" style="flex-wrap:wrap"><h1>Hospital analytics</h1><div style="display:flex;gap:8px"><button class="btn" data-a="t" data-i="Exporting current view as PDF…">${ic("dl","#0755AD",14)} Export PDF</button><button class="btn" data-a="t" data-i="Downloading CSV of filtered analytics…">${ic("dl","#0755AD",14)} Download CSV</button></div></div>
 <div class="card"><div class="ch"><h2>Filters</h2></div><div style="display:flex;gap:12px;flex-wrap:wrap">${sel("vil","Village",["All","Semri","Kotra","Bilaspur"])}${sel("anm","ANM",["All","P. Verma","K. Rao"])}${sel("mon","Month",["All","Jul","Jun"])}</div></div>
 <div class="card ov2"><div class="ch"><h2>ANC completion by village<small>${R.length} record(s) matched</small></h2></div><svg viewBox="0 0 ${Math.max(R.length,1)*150+40} 240" style="min-width:${Math.max(R.length,1)*150+40}px;width:100%" role="img" aria-label="Bar chart of ANC completion, high-risk cases and deliveries"><g stroke="#D8E4F0">${[0,25,50,75,100].map(v=>`<line x1="34" x2="${R.length*150+40}" y1="${200-v*1.7}" y2="${200-v*1.7}"/>`).join("")}</g>${R.map((r,i)=>[[r[3],"#0755AD"],[r[4],"#D92D20"],[r[5],"#0B8F63"]].map((b,j)=>`<rect x="${44+i*150+j*34}" y="${200-b[0]*1.7}" width="28" height="${b[0]*1.7}" rx="4" fill="${b[1]}"><title>${["ANC completion %","High-risk cases","Deliveries"][j]}: ${b[0]}</title></rect>`).join("")+`<text x="${44+i*150+50}" y="220" font-size="12" text-anchor="middle" fill="#1B2D45">${r[0]} · ${r[2]}</text>`).join("")}</svg><div style="font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap"><span style="color:#0755AD">■ ANC completion %</span><span style="color:#D92D20">■ High-risk cases</span><span style="color:#0B8F63">■ Deliveries</span></div></div>
 <div class="card ov2" style="padding:6px"><table><thead><tr><th>Village</th><th>ANM</th><th>Month</th><th>ANC completion</th><th>High-risk</th><th>Deliveries</th></tr></thead><tbody>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><b>${r[3]}%</b></td><td><b>${r[4]}</b></td><td><b>${r[5]}</b></td></tr>`).join("")}</tbody></table></div>`}
function msgV(){const t=P[S.thr],last=`Update on ${t.name}'s ${t.risk=="high"?"referral":"ANC visit"}`;return`<h1 style="margin-bottom:16px">Messages</h1><div class="mg" style="display:grid;grid-template-columns:280px 1fr;gap:16px;height:calc(100vh - 220px);min-height:360px"><div class="card" style="overflow:auto"><div class="ch"><h2>Communication center</h2></div>${P.map((p,i)=>`<div class="row" style="${S.thr==i?"background:var(--lb)":""}" data-a="thr" data-i="${i}">${av(p.anm)}<div style="min-width:0"><b style="color:var(--t1)">${p.anm}</b><div style="font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Update on ${p.name}'s ${p.risk=="high"?"referral":"ANC visit"}</div></div></div>`).join("")}</div><div class="card"><div class="ch"><h2>${t.anm} — re: ${t.name}</h2></div><div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px">${last}. Please review the latest vitals when you have a moment.</div>${(S.sent[S.thr]||[]).map(m=>`<div class="bub d">${m}</div>`).join("")}<div style="display:flex;gap:8px;margin-top:10px"><input class="f" id="rp" placeholder="Type a reply…" aria-label="Reply"><button class="btn p" data-a="rep">Send</button></div></div></div>`}
function setV(){return`<h1 style="margin-bottom:16px">Settings</h1><div class="card">${[["Language","English"],["Theme","Light"],["Accessibility","Standard text size"],["Notifications","Enabled — high-risk alerts prioritized"],["Doctor profile","Dr. Sunita Kapoor, OB-GYN"],["Hospital settings","Rajpura District Hospital, Ward 3"]].map(r=>`<div class="row"><div><b style="color:var(--t1)">${r[0]}</b><div style="font-size:12.5px;color:var(--t3)">${r[1]}</div></div><button class="btn" style="margin-left:auto" data-a="t" data-i="${r[0]} settings updated (demo).">Edit</button></div>`).join("")}</div><div class="card"><div class="ch"><h2>Status legend<small>Every status has a label and icon, never colour alone</small></h2></div><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.keys(SI).map(stc).join("")}</div></div>`}
function draw(){$("#side").className=S.menu?"open":"";$("#ov").className="ov"+(S.menu?" open":"");$("#side").innerHTML=side();
 const un=NT.filter((n,i)=>!S.read.includes(i)).length;$("#bell").innerHTML=ic("bell","currentColor",18)+(un?'<span class="dot"></span>':"");const np=$("#np");np.hidden=!S.notif;np.innerHTML=`<div class="lbl" style="padding:12px 16px">Notifications</div>`+NT.map((n,i)=>`<button class="${S.read.includes(i)?"":"u"}" data-a="nt" data-i="${i}"><b style="color:var(--t1)">${n[0]}</b><br><span style="font-size:13px">${n[1]}</span></button>`).join("");
 $("#cq").style.display=S.q?"block":"none";
 const f={hist:histG,pat:patG,dash,pts,patient,refs,appts,reps:repsV,labs:labsV,tl:tlV,ana:anaV,msg:msgV,set:setV};$("#main").innerHTML=f[S.v]();if(S.scr){const e=document.getElementById(S.scr);S.scr=null;if(e&&e.scrollIntoView)e.scrollIntoView({block:"center"})}}
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(S.q.trim()&&S.v!="pts"&&S.v!="patient")S.v="pts";draw()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b){if(S.notif&&!e.target.closest("#np")){S.notif=0;draw()}return}const a=b.dataset.a,i=b.dataset.i;
 if(a=="selp"||a=="flt"||a=="cmp")return;
 if(a=="menu"){S.menu=!S.menu;draw()}
 else if(a=="notif"){S.notif=!S.notif;draw()}
 else if(a=="clq"){S.q="";$("#q").value="";draw()}
 else if(a=="nav"){if(i=="out")return toast("Session ended. (Demo — not really logged out.)");go(i,{risk:null})}
 else if(a=="open"){go("patient",{id:+i});if(b.dataset.t){S.tab=b.dataset.t;draw()}}
 else if(a=="kpi"){i=="hr"?go("pts",{risk:"high"}):i=="em"?toast("Opening emergency queue — 1 active case (simulated)."):go(i,{risk:null})}
 else if(a=="pdx"){S.pat=S.pat==i?null:i;draw()}
 else if(a=="pdh"){const pid=+i.split("-")[1],E=detect(pt(pid)).all.find(x=>x.id==i);S.hl=new Set(E.ev.map(x=>x.id+":"+x.k));S.pat=i;S.openRec=E.ev.length?E.ev[E.ev.length-1].id:null;S.scr=E.ev.length?"rec-"+E.ev[0].id:null;toView("h",pid);draw()}
 else if(a=="rec"){const r=RM[i];if(b.dataset.p){const E=detect(pt(r.pid)).all.find(x=>x.id==b.dataset.p);S.hl=new Set(E.ev.map(x=>x.id+":"+x.k));S.pat=b.dataset.p}S.openRec=(b.dataset.row&&S.openRec==i)?null:i;S.scr=S.openRec?"rec-"+i:null;toView("h",r.pid);draw()}
 else if(a=="hf"){S.hf=i;draw()}
 else if(a=="clh"){S.hl=new Set();draw()}
 else if(a=="pdgo"){S.pat=i;S.scr="pd-"+i;toView("p",+i.split("-")[1]);draw()}
 else if(a=="pdr"){S.rvO=S.rvO==i?null:i;draw()}
 else if(a=="pdsave"){const c=document.getElementById("rc-"+i).value.trim();if(!c)return toast("Enter a clinical comment before saving the review.");const pid=+i.split("-")[1],E=detect(pt(pid)).all.find(x=>x.id==i);S.rv[i]={by:"Dr. Kapoor",at:"14 Jul 2026",c};(S.notes[pid]=S.notes[pid]||[]).unshift(`14 Jul 2026 — Dr. Kapoor: Reviewed pattern ${i} (${E.r.name}; prototype rule-based detection). Comment: ${c}`);S.rvO=null;toast("Review recorded and added to the doctor notes log.");draw()}
 else if(a=="cfgsave"){const r=RULES.find(x=>x.id==i),g=s=>{const e=document.getElementById(s+"-"+i);return e?e.value:""},c={cat:g("cc")||null};
  if(r.kind=="sym"){c.n=+g("cn");c.m=+g("cm");if(!(c.n>0&&c.m>=c.n))return toast("Enter N and M with 1 ≤ N ≤ M.")}
  else if(r.kind=="thr"||r.kind=="delta"){c.val=g("cv");if(r.kind=="thr")c.op=g("co");if(c.val===""||isNaN(+c.val))return toast("Enter a numeric value.")}
  S.cfg[i]=c;toast("Rule "+i+" saved (this browser session only).");draw()}
 else if(a=="cfgclr"){delete S.cfg[i];draw()}
 else if(a=="addrec")addVisit()
 else if(a=="patp"){go("patient",{id:+i});S.tab="patterns";draw()}
 else if(a=="clr"){S.risk=null;draw()}
 else if(a=="tab"){S.tab=i;draw()}
 else if(a=="wk"){S.wk=S.wk==i?null:i;draw()}
 else if(a=="exp"){S.exp=!S.exp;draw()}
 else if(a=="rng"){S.rng=i;draw()}
 else if(a=="thr"){S.thr=+i;draw()}
 else if(a=="rep"){const v=$("#rp").value.trim();if(v){(S.sent[S.thr]=S.sent[S.thr]||[]).push(v);toast("Message sent to "+P[S.thr].anm+".");draw()}}
 else if(a=="ask")ask(i)
 else if(a=="send"){const v=$("#ai").value.trim();if(v)ask(v)}
 else if(a=="t")toast(i)
 else if(a=="nt"){S.read.push(+i);const n=NT[i];S.notif=0;n[2]=="patient"?go("patient",{id:n[3]}):go(n[2])}
 else if(a=="acc"){S.ref.find(r=>r.id==i).st="acc";toast(pt(i).name+" moved into your review queue.");draw()}
 else if(a=="info"){S.ref.find(r=>r.id==i).info=1;toast("Message sent requesting more information.");draw()}
 else if(a=="sc"){const r=S.ref.find(r=>r.id==i);r.sc=!r.sc;draw()}
 else if(a=="cf"){const r=S.ref.find(r=>r.id==i);r.st="sch";r.sc=0;toast("Appointment scheduled for "+pt(i).name+".");draw()}
 else if(a=="up"){S.busy=1;draw();setTimeout(()=>{S.busy=0;(S.reps[1]=S.reps[1]||[]).unshift({t:"Blood Report",d:"14 Jul 2026",ab:1,s:"AI extraction: Hemoglobin 9.2 g/dL (low), Ferritin 8 ng/mL (low) — compared with previous report, both trending down."});toast("AI analysis complete — report added to patient timeline.");draw()},1400)}
 else if(a=="draft")toast("Draft saved locally.")
 else if(a=="sign"){const d=$("#dx").value.trim(),pl=$("#pl").value.trim(),t=$("#ts").value,fu=$("#fu").value.trim();if(!d&&!pl)return toast("Add a diagnosis or treatment plan before saving.");(S.notes[S.sel]=S.notes[S.sel]||[]).unshift(`14 Jul 2026 — Dr. Kapoor: ${d?"Diagnosis: "+d+". ":""}${pl?"Plan: "+pl+". ":""}${t!="None"?"Ordered: "+t+". ":""}Disposition: ${$("#dp").value}.${fu?" Follow-up: "+fu+".":""}`);toast("Clinical note saved to patient record.");S.tab="notes";draw()}
});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(a=="selp"){S.sel=+t.value;S.wk=null;S.hl=new Set();S.openRec=null;S.pat=null;S.rvO=null;draw()}if(a=="flt"){S.f[t.dataset.k]=t.value;draw()}if(a=="cmp"){S.cmp=t.checked;draw()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"){if(e.target.id=="ai"){const v=e.target.value.trim();if(v)ask(v)}if(e.target.id=="rp")document.querySelector('[data-a="rep"]').click()}if(e.key=="Escape"&&S.menu){S.menu=0;draw()}});
draw();

/* sidebar behaviour on phones: lock page scroll while open, swipe-left / resize / Esc close it */
(function(){const sd=document.getElementById("side");let x0=null;
 const shut=()=>{if(S.menu){S.menu=0;draw()}};
 sd.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
